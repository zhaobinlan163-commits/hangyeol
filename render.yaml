services:
  - type: web
    name: hangyeol
    runtime: node
    plan: free
    region: singapore
    branch: main
    # 必须带 --include=dev：构建需要 vite 与 esbuild（devDependency）
    buildCommand: npm install --include=dev && npm run build
    # 构建产物 server.mjs 是打包后的 ESM，不依赖 Node 的 TS 运行时
    startCommand: NODE_ENV=production node server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      # 服务器兜底 key 是可选的：默认留空，用户在网页「设置」里填自己的 key。
      # 想设全局兜底，就在 Render 控制台 → Environment 里手动加 DEEPSEEK_API_KEY。
