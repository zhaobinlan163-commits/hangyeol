services:
  - type: web
    name: hangyeol
    runtime: node
    plan: free
    region: singapore
    branch: main
    # 必须带 --include=dev：构建需要 vite（devDependency）
    buildCommand: npm install --include=dev && npm run build
    # Render 会注入 PORT；这里显式声明 NODE_ENV=production，
    # server.ts 在 production 下才会读 process.env.PORT 并托管 dist/
    startCommand: NODE_ENV=production node server.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      # 服务器兜底 key 是可选的：默认留空，用户在网页「设置」里填自己的 key。
      # 想设全局兜底，就在 Render 控制台 → Environment 里手动加 DEEPSEEK_API_KEY。
